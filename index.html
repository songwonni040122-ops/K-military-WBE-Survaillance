  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, line, col, err) {
        document.getElementById('root').innerHTML =
          '<div style="padding:40px;background:#0a0a0f;color:#ff4444;font-family:monospace;height:100vh">' +
          '<h1 style="color:#ff6666">JS Error</h1>' +
          '<pre style="color:#ffaaaa;white-space:pre-wrap">' + msg + '</pre>' +
          '<pre style="color:#888;font-size:12px">' + (url||'') + ':' + (line||'') + '</pre>' +
          '<pre style="color:#666;font-size:11px">' + (err && err.stack || '') + '</pre></div>';
      };
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('root').innerHTML =
          '<div style="padding:40px;background:#0a0a0f;color:#ff4444;font-family:monospace;height:100vh">' +
          '<h1 style="color:#ff6666">Unhandled Promise Rejection</h1>' +
          '<pre style="color:#ffaaaa;white-space:pre-wrap">' + (e.reason && e.reason.message || e.reason || 'Unknown') + '</pre>' +
          '<pre style="color:#666;font-size:11px">' + (e.reason && e.reason.stack || '') + '</pre></div>';
      });
    </script>
  </body>
